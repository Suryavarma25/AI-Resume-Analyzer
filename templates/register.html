<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - AI Resume Analyzer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .register-container {

            width: 100%;

            max-width: 450px;

            padding: 20px;
        }


        .register-card {

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.10);
        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #2563eb;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }


        .register-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .register-button:hover {

            background: #1d4ed8;
        }


        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }


        .login-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }


        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 15px;

            text-align: center;
        }


        .success {

            background: #dcfce7;

            color: #166534;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>


<body>


    <div class="register-container">


        <div class="register-card">


            <div class="logo">

                AI Resume Analyzer

            </div>


            <p class="subtitle">

                Create your account

            </p>


            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}


            {% if success %}

                <div class="success">

                    {{ success }}

                </div>

            {% endif %}


            <form
                action="/register"
                method="POST"
            >


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">

                        Full Name

                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">

                        Confirm Password

                    </label>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-button"
                >

                    Create Account

                </button>


            </form>


            <div class="login-link">

                Already have an account?

                <a href="/login">

                    Login

                </a>

            </div>


        </div>


    </div>


</body>

</html>
