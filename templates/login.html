<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Resume Analyzer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-container {

            width: 100%;

            max-width: 450px;

            padding: 20px;
        }

        .login-card {

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.10);
        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #2563eb;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #2563eb;
        }

        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {

            background: #1d4ed8;
        }

        .register-link {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .register-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                AI Resume Analyzer

            </div>

            <p class="subtitle">

                Login to your account

            </p>


            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}


            <form
                action="/login"
                method="POST"
            >

                <div class="form-group">

                    <label for="email">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">

                        Password

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >

                    Login

                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="/register">

                    Create Account

                </a>

            </div>

        </div>

    </div>

</body>

</html>
